# ==============================================================================
# KITTY CONFIGURATION (Base)
# ==============================================================================

# --- Cursor & Scrolling -------------------------------------------------------
cursor_trail                10
scrollbar                   always
scrollbar_width             0.5
scrollbar_hover_width       1.0
scrollbar_handle_opacity    1.0
scrollbar_interactive       yes
scrollbar_jump_on_click     yes
scrollbar_track_color       selection_background

# --- Mouse & URLs -------------------------------------------------------------
mouse_hide_wait             1.0 0.1 100 no
open_url_with               firefox
url_prefixes                file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls                 yes
show_hyperlink_targets      yes
underline_hyperlinks        always
select_by_word_characters   @-./_~?&=%+#

# --- Window Layout & Performance ----------------------------------------------
sync_to_monitor             yes
remember_window_position    yes
window_margin_width         0
window_padding_width        0
confirm_os_window_close     0
hide_window_decorations     no
visual_bell_color           #923852

# --- Display Server & Remote Control ------------------------------------------
linux_display_server        auto
wayland_titlebar_color      system
allow_remote_control        yes
dynamic_background_opacity  yes
background_image_layout     cscaled
notify_on_cmd_finish        unfocused

# --- Tab Bar ------------------------------------------------------------------
tab_bar_edge                top
tab_bar_margin_width        2.0
tab_bar_min_tabs            2
tab_title_max_length        15
tab_title_template          "{index}⏵ {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"

# --- Keybindings --------------------------------------------------------------
kitty_mod                   ctrl+shift

# Tabs
map kitty_mod+n             new_tab
map alt+c                   close_tab
map kitty_mod+m             detach_tab
map kitty_mod+l             next_tab
map kitty_mod+h             previous_tab
map kitty_mod+x             select_tab

# Shortcuts
map f1                      launch --type=tab nvim
map kitty_mod+u             scroll_page_up
map kitty_mod+d             scroll_page_down
map kitty_mod+z             scroll_to_prompt -1

# --- Theme --------------------------------------------------------------------
# Includes the active rice color palette, font, and background opacity
include theme.conf
